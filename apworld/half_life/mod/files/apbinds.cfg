// Archipelago command binds for Half-Life.
//
// Why binds at all: opening the console pauses single-player, and a paused
// server runs no frames -- which is where this mod does everything it defers.
// A command typed into the console therefore sits there until the console is
// closed again. A bound key runs the same command with the game still running,
// so the answer comes back immediately and a warp happens when you press it.
//
// The keys are the unused ones on the right of the keyboard. Rebind freely:
// this file is yours once it exists, and reinstalling the mod will not
// overwrite it. To turn a bind off, delete its line.
//
// The two commands that take an argument -- ap_warp and ap_find -- cannot be
// usefully bound to a bare key. Type those in chat instead: !warp 3 and
// !find shotgun both work with the game running, as does every other command
// below with a ! in front of it.

bind "p" "ap"            // the mission list, and which are open
bind "o" "ap_tracker"    // what is left to find
bind "i" "ap_help"       // every command
bind "l" "ap_hub"        // back to the lobby
bind "k" "ap_warps"      // your warp points
bind "semicolon" "ap_setwarp"  // set the warp point for this part, here

echo "Archipelago: p=missions o=tracker i=help l=hub k=warps ;=setwarp"
