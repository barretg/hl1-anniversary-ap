// The !menu keys. Run every launch from valve.rc and replaced by every update,
// unlike apbinds.cfg: the menu's Back, More and Exit are keys 8, 9 and 0, which
// retail Half-Life leaves unbound, and a menu without them is stuck. Outside a
// menu these do nothing, since no weapon uses slots 8 to 10.

bind "8" "slot8"
bind "9" "slot9"
bind "0" "slot10"
