# Example player YAML for Half-Life (Sven Co-op).
#
# Drop this in your Archipelago `Players/` folder and edit `name`.

name: Freeman
game: Half-Life (Sven Co-op)
description: Half-Life campaign in Sven Co-op

Half-Life (Sven Co-op):
  # How many missions must be finished before the Nihilanth mission opens.
  # Nihilanth is never unlocked by an item. Default is every other mission (17).
  missions_required: 17

  # strict: later missions expect a real gun; the late game expects something
  #         heavier than a pistol.
  # loose:  only hard requirements (long jump module, HEV suit) are enforced.
  logic_difficulty:
    strict: 1
    loose: 0

  # Shuffle the HEV suit into the pool. Xen expects it, because the long jump
  # module runs off suit power.
  shuffle_hev_suit: false

  # Shuffle the long jump module into the pool. When on, Xen expects it.
  shuffle_longjump: false

  # Reserved for traps; leave at 0.
  trap_percentage: 0

  # Any death gibs the entire Sven Co-op lobby and is sent to the multiworld.
  death_link: false

  progression_balancing: 50
  accessibility: full
